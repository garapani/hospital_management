name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Nx Cloud task distribution is not connected yet.
      # When it is, re-add the corresponding `nx start-ci-run` step here,
      # run as early as possible (before dependencies are installed).
      # See: https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx format:check --base="remotes/origin/main"
      # lint/build/e2e are intentionally omitted: no ESLint config, build, or
      # e2e targets exist yet for any project, so nx run-many would silently
      # no-op on them. Add them back once those targets are actually wired up.
      - run: pnpm exec nx run-many -t test typecheck

      # Nx Cloud self-healing CI is not connected yet.
      # When it is, re-add the corresponding `nx fix-ci` step here.
      # See: https://nx.dev/docs/features/ci-features/self-healing-ci
