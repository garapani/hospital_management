name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: identity_access
          POSTGRES_PASSWORD: identity_access_dev_password
          POSTGRES_DB: identity_access
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Nx Cloud task distribution is not connected yet.
      # When it is, re-add the corresponding `nx start-ci-run` step here,
      # run as early as possible (before dependencies are installed).
      # See: https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Wait for PostgreSQL to be ready
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U identity_access; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - run: pnpm exec nx format:check --base="remotes/origin/main"
      # build/e2e are intentionally omitted: no build or e2e targets exist yet
      # for any project, so nx run-many would silently no-op on them. Add them
      # back once those targets are actually wired up.
      - run: pnpm exec nx run-many -t test typecheck lint
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: identity_access
          DB_PASSWORD: identity_access_dev_password
          DB_DATABASE: identity_access
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Nx Cloud self-healing CI is not connected yet.
      # When it is, re-add the corresponding `nx fix-ci` step here.
      # See: https://nx.dev/docs/features/ci-features/self-healing-ci
