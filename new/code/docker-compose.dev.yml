services:
  api-postgres:
    image: postgres:16-alpine
    container_name: api-postgres-dev
    environment:
      POSTGRES_USER: hospital_db_user
      POSTGRES_PASSWORD: hospital_db_password
      POSTGRES_DB: hospital_db
    ports:
      - '5433:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospital_db_user']
      interval: 5s
      timeout: 5s
      retries: 5

  api-redis:
    image: redis:7-alpine
    container_name: api-redis-dev
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: api-minio-dev
    environment:
      MINIO_ROOT_USER: hospital_dev
      MINIO_ROOT_PASSWORD: hospital_dev_password
    command: server /data --console-address ":9001"
    ports:
      - '9002:9000'
      - '9003:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    container_name: api-dev
    depends_on:
      api-postgres:
        condition: service_healthy
      api-redis:
        condition: service_healthy
      api-minio:
        condition: service_healthy
    environment:
      CI: 'true'
      DB_HOST: api-postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: hospital_db_password
      DB_DATABASE: hospital_db
      REDIS_HOST: api-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: api-minio
      MINIO_PORT: 9000
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm nx serve api --host 0.0.0.0"

  seed-rbac:
    profiles: ['seed']
    image: node:22-alpine
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      CI: 'true'
      DB_HOST: api-postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: hospital_db_password
      DB_DATABASE: hospital_db
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm nx run api:seed-rbac"

  seed-initial-setup:
    profiles: ['seed']
    image: node:22-alpine
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      CI: 'true'
      DB_HOST: api-postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: hospital_db_password
      DB_DATABASE: hospital_db
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm nx run api:seed-initial-setup"

  seed-all:
    profiles: ['seed']
    image: node:22-alpine
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      CI: 'true'
      DB_HOST: api-postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: hospital_db_password
      DB_DATABASE: hospital_db
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "corepack enable && pnpm install && pnpm nx run api:seed-all"
