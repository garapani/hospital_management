services:
  postgres:
    image: postgres:16
    container_name: hospital-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ../../../../data/hospital/postgresql:/var/lib/postgresql/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hospital-redis
    restart: always
    volumes:
      - ../../../../data/hospital/redis:/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: hospital-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-hospital_dev}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-hospital_dev_password}
    volumes:
      - ../../../../data/hospital/minio:/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: platform migrations first, then tenant migrations for every
  # already-provisioned tenant. Run manually with:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  # The runners execute via the swc-node loader that ships in the image (devDependencies are not
  # pruned in the current single-stage Dockerfile), so no extra compile step is needed.
  migrate:
    image: hospital-api:latest
    container_name: hospital-api-migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - >-
        node --import @swc-node/register/esm-register apps/api/src/database/migrate.ts &&
        node --import @swc-node/register/esm-register apps/api/src/database/migrate-tenants.ts

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hospital-prometheus
    restart: always
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../../data/hospital/prometheus:/prometheus
    ports:
      - '9090:9090'
    networks:
      - hospital-network

  api:
    build:
      context: .  
      dockerfile: Dockerfile
    image: hospital-api:latest
    container_name: hospital-api
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospital-network

networks:
  hospital-network:
    name: hospital-network
    driver: bridge