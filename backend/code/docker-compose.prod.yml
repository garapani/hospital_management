services:
  postgres:
    image: postgres:16
    container_name: hospital-postgres
    restart: always
    environment:
      POSTGRES_USER: hospital_db_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      POSTGRES_DB: hospital_db
    volumes:
      - ../../../../data/hospital/postgresql:/var/lib/postgresql/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_db_user -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly automated backup: dumps hospital_db (all tenant schemas + public), validates,
  # gzips, and optionally uploads to S3. Runs on its own schedule inside the stack (see
  # scripts/backup-cron-entrypoint.sh) — an alternative to the host-cron + scripts/backup-db.sh
  # approach documented in Deployment-Guide.md "Backup Configuration", not a replacement for it;
  # use whichever fits the deployment (this one needs no access to the host running compose).
  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: hospital-backup:latest
    container_name: hospital-backup
    restart: always
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: hospital_db_user
      POSTGRES_DB: hospital_db
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      BACKUP_DIR: /backups
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_HOUR_UTC: "${BACKUP_HOUR_UTC:-2}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_PREFIX: "${S3_PREFIX:-postgres-backups}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-south-1}"
    volumes:
      - ../../../../data/hospital/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network

  redis:
    image: redis:7
    container_name: hospital-redis
    restart: always
    volumes:
      - ../../../../data/hospital/redis:/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: hospital-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY:?Error: OBJECT_STORAGE_ACCESS_KEY environment variable is required}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY:?Error: OBJECT_STORAGE_SECRET_KEY environment variable is required}"
    volumes:
      - ../../../../data/hospital/minio:/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: platform migrations first, then tenant migrations for every
  # already-provisioned tenant. Run manually with:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  # The runners execute via the swc-node loader that ships in the image (devDependencies are not
  # pruned in the current single-stage Dockerfile), so no extra compile step is needed.
  migrate:
    image: hospital-api:latest
    container_name: hospital-api-migrate
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: minio
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:?Error: OBJECT_STORAGE_ACCESS_KEY environment variable is required}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:?Error: OBJECT_STORAGE_SECRET_KEY environment variable is required}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable is required}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - >-
        node --import @swc-node/register/esm-register apps/api/src/database/migrate.ts &&
        node --import @swc-node/register/esm-register apps/api/src/database/migrate-tenants.ts

  seed-rbac:
    profiles: ['seed']
    image: hospital-api:latest
    container_name: hospital-api-seed-rbac
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - node --import @swc-node/register/esm-register apps/api/src/database/seed-rbac-catalog-runner.ts

  seed-initial-setup:
    profiles: ['seed']
    image: hospital-api:latest
    container_name: hospital-api-seed-initial-setup
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - node --import @swc-node/register/esm-register apps/api/src/database/seed-initial-setup-runner.ts

  seed-all:
    profiles: ['seed']
    image: hospital-api:latest
    container_name: hospital-api-seed-all
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: minio
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:?Error: OBJECT_STORAGE_ACCESS_KEY environment variable is required}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:?Error: OBJECT_STORAGE_SECRET_KEY environment variable is required}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - node --import @swc-node/register/esm-register apps/api/src/database/migrate.ts && node --import @swc-node/register/esm-register apps/api/src/database/seed-rbac-catalog-runner.ts && node --import @swc-node/register/esm-register apps/api/src/database/seed-packages-catalog-runner.ts && node --import @swc-node/register/esm-register apps/api/src/database/seed-initial-setup-runner.ts && node --import @swc-node/register/esm-register apps/api/src/database/seed-ledger-accounts.ts

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hospital-prometheus
    restart: always
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../../data/hospital/prometheus:/prometheus
    ports:
      - '9090:9090'
    networks:
      - hospital-network

  api:
    build:
      context: .  
      dockerfile: Dockerfile
    image: hospital-api:latest
    container_name: hospital-api
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: minio
      OBJECT_STORAGE_PORT: 9000
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:?Error: OBJECT_STORAGE_ACCESS_KEY environment variable is required}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:?Error: OBJECT_STORAGE_SECRET_KEY environment variable is required}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable is required}"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospital-network

  # Drains outbox_events (every provisioned tenant schema) into reporting_events/audit_records —
  # see Development-Standards.md's outbox section and database/outbox-dispatcher-entrypoint.ts.
  # A separate long-running process from `api` itself, not a NestJS-scheduled job inside it: keeps
  # the drain isolated from request-serving load and gives it its own restart/monitoring lifecycle,
  # same rationale as the `backup` service above.
  outbox-dispatcher:
    image: hospital-api:latest
    container_name: hospital-outbox-dispatcher
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hospital_db_user
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}"
      DB_DATABASE: hospital_db
      OUTBOX_POLL_INTERVAL_MS: "${OUTBOX_POLL_INTERVAL_MS:-5000}"
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-50}"
      OUTBOX_MAX_ATTEMPTS: "${OUTBOX_MAX_ATTEMPTS:-5}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network
    command:
      - sh
      - -c
      - node --import @swc-node/register/esm-register apps/api/src/database/outbox-dispatcher-entrypoint.ts

networks:
  hospital-network:
    name: hospital-network
    driver: bridge